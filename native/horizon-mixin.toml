[mod]
id = "flashback"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "d91353641866b85d851926da3b1a9fdee46392f1"

[[crate]]
id = "engine"
path = "engine"
dependent = "horizon-client-lib"

[[module]]
id = "network"
file = "crates/horizon-client/src/net.rs"
name = "flashback_net"
source = "network.rs"
visibility = "pub"

[[injection]]
id = "network-run"
kind = "HEAD"
cancellable = true
target = "horizon_client_lib::net::run"
helper = "network_run.rs"
bindings = [{name = "address", ty = "&str", value = "address"}, {name = "writer", ty = "&Mutex<Option<ConnWriter>>", value = "shared_writer"}, {name = "send", ty = "&Sender<Event>", value = "send"}]

[[injection]]
id = "network-poll"
kind = "RETURN"
target = "horizon_client_lib::net::Session::poll"
helper = "network_poll.rs"
bindings = [{name = "value", ty = "Vec<Event>", value = "$value"}, {name = "session", ty = "&Session", value = "self"}]

[[injection]]
id = "network-close"
kind = "HEAD"
target = "horizon_client_lib::net::Session::disconnect"
helper = "network_close.rs"
bindings = [{name = "session", ty = "&mut Session", value = "self"}]

[[injection]]
id = "network-backlog"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::poll_remote"
helper = "network_backlog.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}]

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "flashback_native"
source = "runtime.rs"

[[module]]
id = "player"
file = "crates/horizon-client/src/game.rs"
name = "flashback_player"
source = "player.rs"

[[module]]
id = "cinematic"
file = "crates/horizon-client/src/game.rs"
name = "flashback_cinematic"
source = "cinematic.rs"

[[injection]]
id = "player-tick"
kind = "HEAD"
hook = "tick"
hook_version = 1
helper = "player_tick.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}]

[[injection]]
id = "player-packet"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::handle_packet"
helper = "player_packet.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}, {name = "packet", ty = "&C", value = "&packet"}]

[[injection]]
id = "replay-input"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::remote_handle_input"
helper = "replay_input.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}]

[[injection]]
id = "replay-pause"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::remote::Game<'_>::tick_remote_level"
helper = "replay_pause.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}]

[[injection]]
id = "unload"
kind = "HEAD"
hook = "client_level_unload"
hook_version = 1
helper = "unload.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}]

[[injection]]
id = "tick"
kind = "HEAD"
hook = "tick"
hook_version = 1
helper = "tick.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}]

[[injection]]
id = "key"
kind = "HEAD"
hook = "key"
hook_version = 1
helper = "key.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}, {name = "key", ty = "&str", value = "key"}, {name = "pressed", ty = "bool", value = "pressed"}]

[[injection]]
id = "camera"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::perspective::Game<'_>::camera_view"
helper = "camera.rs"
bindings = [{name = "game", ty = "&mut Game<'_>", value = "self"}, {name = "partial", ty = "f32", value = "partial"}]

[[injection]]
id = "fov"
kind = "HEAD"
hook = "compute_fov"
hook_version = 1
helper = "fov.rs"
bindings = [{name = "game", ty = "&Game<'_>", value = "self"}, {name = "position", ty = "[f64; 3]", value = "camera"}, {name = "degrees", ty = "&mut f32", value = "degrees"}]

[[injection]]
id = "screen"
kind = "HEAD"
hook = "screen_render_post"
hook_version = 1
helper = "screen.rs"
bindings = [{name = "game", ty = "&Game<'_>", value = "self"}, {name = "batch", ty = "&mut HudBatch", value = "batch"}]

[[injection]]
id = "click"
kind = "HEAD"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
helper = "click.rs"
bindings = [{name = "game", ty = "&Game<'_>", value = "self"}, {name = "screen", ty = "&NativeScreenView<'_>", value = "screen"}, {name = "button", ty = "i32", value = "button"}, {name = "canceled", ty = "&mut bool", value = "canceled"}]

[[injection]]
id = "mod-list"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "mods.rs"
bindings = [{name = "mods", ty = "&mut Vec<NativeMod>", value = "mods"}]
