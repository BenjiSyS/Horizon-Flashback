[package]
name = "horizon-flashback"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Native Rust replay recording and cinematic editing for Horizon"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"

[lib]
path = "src/lib.rs"
